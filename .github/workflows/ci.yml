name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        # The Go integration tests truncate tables, so CI points them at a
        # dedicated database that holds nothing else.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rollboard_test
          POSTGRES_USER: rollboard
          POSTGRES_PASSWORD: rollboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rollboard -d rollboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        env:
          # Services are provided by the job, so the script must not try to
          # start its own via Docker Compose.
          ROLLBOARD_SKIP_TEST_SERVICES: '1'
          ROLLBOARD_TEST_DATABASE_URL: postgres://rollboard:rollboard@127.0.0.1:5432/rollboard_test?sslmode=disable
          ROLLBOARD_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: ./scripts/test.sh

      - name: Assert integration tests were not skipped
        env:
          ROLLBOARD_SKIP_TEST_SERVICES: '1'
          ROLLBOARD_TEST_DATABASE_URL: postgres://rollboard:rollboard@127.0.0.1:5432/rollboard_test?sslmode=disable
          ROLLBOARD_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        # A suite that silently skips its integration tests reports "ok" while
        # proving nothing. That is how this repository shipped an
        # unauthenticated write endpoint, so CI fails on any skip.
        run: |
          skipped="$(./scripts/test.sh -v | grep -c '^--- SKIP' || true)"
          if [ "$skipped" != "0" ]; then
            echo "$skipped test(s) skipped; integration coverage is not running." >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm test
      - run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Pull requests from forks cannot access the registry token, so the
        # image is built but not pushed for them.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
