services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rollboard}
      POSTGRES_USER: ${POSTGRES_USER:-rollboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
    volumes:
      - rollboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${ROLLBOARD_IMAGE:-ghcr.io/mirivlad/rollboard:latest}
    environment:
      ROLLBOARD_DATABASE_URL: postgres://${POSTGRES_USER:-rollboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rollboard}?sslmode=disable
      ROLLBOARD_DATABASE_MAX_CONNS: ${ROLLBOARD_DATABASE_MAX_CONNS:-20}
      ROLLBOARD_REDIS_URL: redis://redis:6379/0
      ROLLBOARD_APP_ORIGIN: ${ROLLBOARD_APP_ORIGIN:?Set_ROLLBOARD_APP_ORIGIN}
      ROLLBOARD_COOKIE_SECURE: "true"
      ROLLBOARD_LOCALES_DIR: /app/locales
      ROLLBOARD_UPLOADS_DIR: /app/uploads
    # The image already ships English and Russian at /app/locales. To add a
    # language or reword the interface, bind-mount a directory that contains a
    # COMPLETE set of catalogs — a mount replaces the built-in ones rather than
    # merging with them, so copy the shipped files in first:
    #
    #   docker run --rm --entrypoint sh ghcr.io/mirivlad/rollboard:latest \
    #     -c 'tar -c -C /app/locales .' | tar -x -C /srv/rollboard/locales
    #
    volumes:
      # Uploaded images must outlive the container.
      - rollboard_uploads:/app/uploads
    #   - /srv/rollboard/locales:/app/locales:ro
    ports:
      - target: 8080
        published: ${ROLLBOARD_PORT:-8080}
        protocol: tcp
        mode: ingress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rollboard_postgres_data:
  rollboard_uploads:
